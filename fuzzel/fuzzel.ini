[main]
font=Hasklug Nerd Font:size=12
terminal=ghostty -e
prompt="❯ "
width=40
lines=5
icons-enabled=yes
horizontal-pad=16
vertical-pad=12
inner-pad=10

[border]
width=1
radius=5

[key-bindings]
prev=Up Control+p Mod1+k
next=Down Control+n Mod1+j

[colors]
background=16161eff
text=c0caf5ff
match=2ac3deff
selection=343a55ff
selection-match=2ac3deff
selection-text=c0caf5ff
border=27a1b9ff
