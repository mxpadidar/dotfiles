general {
    lock_cmd = pidof hyprlock || systemd-cat --identifier=hyprlock hyprlock --verbose
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    inhibit_sleep = 3 # Wait for the session to report itself locked before sleep.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# Dim the laptop backlight after 3 minutes; restore it on activity.
listener {
    timeout = 180
    on-timeout = brightnessctl -c backlight -s set 10%
    on-resume = brightnessctl -c backlight -r
}

# Lock after 5 minutes.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn displays off after 5.5 minutes; wake them on activity.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend after 30 minutes on battery; recheck every minute while plugged in.
listener {
    timeout = 1800
    condition_cmd = grep -q '^Discharging$' /sys/class/power_supply/BAT*/status
    condition_retry = 60
    on-timeout = systemctl suspend
}
