$font = Hasklug Nerd Font

general {
    hide_cursor = true
    screencopy_mode = 1 # Use CPU capture to avoid the GPU screencopy path.
}

animations {
    enabled = true
    animation = global, 0
    animation = inputFieldColors, 1, 1, default
}

background {
    monitor =
    color = rgb(1a1b26) # Fallback while the screenshot loads.
    path = screenshot
    blur_size = 6
    blur_passes = 3
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = rgb(7dcfff)
    font_size = 56
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(9aa5ce)
    font_size = 14
    font_family = $font
    position = 0, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 36
    outline_thickness = 1
    inner_color = rgb(16161e)
    outer_color = rgb(7aa2f7)
    check_color = rgb(bb9af7)
    fail_color = rgb(f7768e)
    capslock_color = rgb(e0af68)
    font_color = rgb(c0caf5)
    fade_on_empty = false
    rounding = 5
    font_family = $font
    font_size = 12
    placeholder_text = Password
    fail_text = Authentication failed. Try again.
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,FA]  ·  Enter to unlock
    color = rgb(9aa5ce)
    font_size = 10
    font_family = $font
    position = 0, -65
    halign = center
    valign = center
}
