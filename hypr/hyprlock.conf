$font = Hasklug Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/.config/hypr/bg/mountain-river.jpg
    blur_passes = 3
}

label {
    monitor =
    text = $TIME
    color = rgb(c0caf5)
    font_size = 72
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(9aa5ce)
    font_size = 16
    font_family = $font
    position = 0, 65
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 36
    outline_thickness = 0
    inner_color = rgba(1a1b26ee)
    outer_color = rgb(7aa2f7)
    check_color = rgb(bb9af7)
    fail_color = rgb(f7768e)
    font_color = rgb(c0caf5)
    fade_on_empty = false
    rounding = 0
    font_family = $font
    font_size = 14
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,FA]  ·  Enter to unlock
    color = rgb(9aa5ce)
    font_size = 12
    font_family = $font
    position = 0, -85
    halign = center
    valign = center
}
