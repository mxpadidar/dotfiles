[terminal]
shell = { program = "/bin/zsh", args = ["-l"] }

[general]
import = ["~/.config/alacritty/tokyo_night_enhanced.toml"]

[window]
# padding = { x = 10, y = 10 }
# dynamic_padding = true
decorations = "None"
opacity = 0.95

[font]
normal = { family = "Hasklug Nerd Font", style = "Regular" }
size = 12.0
offset = { x = 0, y = 1 }

[scrolling]
history = 20000
multiplier = 3

[cursor]
style = { shape = "Beam", blinking = "Off" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[keyboard]
# Alt shortcuts belong to Neovim/Zsh. Terminal actions use Control+Shift.
bindings = [
    { key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "F", mods = "Control|Shift", action = "SearchForward" },
    { key = "Space", mods = "Control|Shift", action = "ToggleViMode" },
]
