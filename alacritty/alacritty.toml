[terminal]
shell = { program = "/bin/zsh", args = ["-l"] }

[general]
import = ["~/.config/alacritty/tokyo_night_enhanced.toml"]

[window]
# padding = { x = 10, y = 10 }
# dynamic_padding = true
decorations = "None"
opacity = 0.95

[font]
normal = { family = "Hasklug Nerd Font", style = "Regular" }
size = 12.0
offset = { x = 0, y = 1 }

[scrolling]
history = 20000
multiplier = 3

[cursor]
style = { shape = "Beam", blinking = "Off" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[keyboard]
bindings = [{ key = "N", mods = "Control|Shift", action = "CreateNewWindow" }]
